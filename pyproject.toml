[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diagpdf"
version = "0.16.1"
description = "Convert PGN / FEN / EPD files into pages of chess diagrams (PDF, LaTeX, HTML, EPUB, DOCX, RTF, Markdown)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ildar Aslyamov" }]
maintainers = [{ name = "Darcio Alberico" }]
keywords = ["chess", "pgn", "fen", "epd", "diagram", "pdf", "epub", "latex", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "fpdf2>=2.7.0",
    "fonttools>=4.40.0",
    "pillow>=9.0.0",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
# Not "what the GUI needs" -- the window runs on tkinter alone. This is the
# Sun Valley theme; without it apply_theme falls back to ttk's `clam`.
gui = ["sv-ttk>=2.6.0"]
moves = ["chess>=1.10"]
dev = ["pytest>=8.0", "ruff>=0.5", "pypdfium2>=4.0"]

[project.scripts]
diagpdf = "diagpdf.cli:main"

[project.gui-scripts]
diagpdf-gui = "diagpdf.gui:run_gui"

[tool.setuptools]
packages = ["diagpdf", "diagpdf.render"]

[tool.setuptools.package-data]
diagpdf = ["../Fonts/*.ttf", "../Fonts/*.TTF", "../icon.ico"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # long lines are checked by line-length, not flagged twice
    "E702",    # aligned constant blocks (BDR_NW = "!"; BDR_N = "z") read better packed
    "SIM105",  # contextlib.suppress is not clearer than a bare try/except here
    "SIM112",  # SystemRoot is the correct casing on Windows
    "SIM401",  # the explicit "OS/2" in font check documents the fallback
    "B008",    # argparse defaults are evaluated once on purpose
]

[tool.ruff.lint.per-file-ignores]
# The compatibility shim exists to re-export; unused imports are the point.
"fen2rtf.py" = ["F401", "E402", "I001"]
# The package __init__ re-exports the public API.
"diagpdf/__init__.py" = ["F401"]
# Tests reach into private helpers deliberately.
"tests/*" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = ["slow: tests that render every font or layout combination"]
